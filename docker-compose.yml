services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Postgres allows 100 connections by default; the API pool below stays under that.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bazimoon}
      POSTGRES_USER: ${POSTGRES_USER:-bazimoon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bazimoon} -d ${POSTGRES_DB:-bazimoon}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/Bazimoon.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Postgres: "Host=postgres;Database=${POSTGRES_DB:-bazimoon};Username=${POSTGRES_USER:-bazimoon};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required};Maximum Pool Size=${API_DB_POOL:-60}"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      Google__ClientId: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      Telegram__MiniAppUrl: ${MINI_APP_BASE_URL:-https://bazimoon.com}
      Agora__AppId: ${AGORA_APP_ID:?AGORA_APP_ID is required}
      Agora__AppCertificate: ${AGORA_APP_CERTIFICATE:?AGORA_APP_CERTIFICATE is required}
      Cors__AllowedOrigins__0: ${PUBLIC_FRONTEND_ORIGIN:-https://bazimoon.com}
      Admin__Username: ${ADMIN_USERNAME:?ADMIN_USERNAME is required}
      Admin__Password: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
    # No host port binding here on purpose — see docker-compose.override.yml for why local `docker
    # compose up` still gets one. Under Coolify (or any Traefik/reverse-proxy-managed host), the
    # proxy routes to this container over the internal Docker network by port alone; publishing a
    # fixed host port would collide with any other stack on the same server also using it.
    expose:
      - "8080"

  frontend:
    build:
      context: .
      dockerfile: frontend/bazimoon-app/Dockerfile
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL:-https://api.bazimoon.com}
        VITE_AGORA_APP_ID: ${AGORA_APP_ID:?AGORA_APP_ID is required}
        VITE_MINI_APP_URL: ${TELEGRAM_MINI_APP_URL:-https://t.me/BazimoonGamesBot}
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "80"

volumes:
  postgres-data:
