server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects (such as adding a trailing slash) stay relative, so they keep https behind the proxy.
    absolute_redirect off;

    # An address that is not a file or an app link still opens the app, but answers 404 so search
    # engines do not index it as a page.
    error_page 404 /index.html;

    # The service worker and manifest must never be cached, or players stay on an old version.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location ~ ^/(workbox-.*\.js|push-sw\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Static search pages (built from seo/): /en/, /fa/ and one page per game in each.
    location ~ ^/(en|fa)(/|$) {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # Hashed build assets never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # App links (see readDeepLink), the sign-in return and the admin console open the single-page app.
    location ~ ^/(t|g|couple|ef|sh|f|friends|play|auth|admin)(/|$) {
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# One address for search engines: www goes to the bare domain.
server {
    listen 80;
    server_name www.bazimoon.com;
    return 301 https://bazimoon.com$request_uri;
}
