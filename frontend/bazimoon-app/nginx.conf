server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The service worker and manifest must never be cached, or players stay on an old version.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location ~ ^/(workbox-.*\.js|push-sw\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The Persian landing page for search engines; /fa redirects to /fa/.
    location = /fa/index.html {
        add_header Cache-Control "no-cache";
    }
    location /fa/ {
        try_files $uri /fa/index.html;
    }

    # Hashed build assets never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else is the single-page app, including invite links like /t/CODE.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
